function apprModal(id){const a=S.apps.find(x=>x.id===id),bs=S.batches.filter(b=>b[6]!=='Closed'&&b[4]<b[5]).map(b=>b[0]);
 modal(`<h3>Approve ${esc(a.n)}</h3><form onsubmit="apprSave(event,'${id}')"><label class="full">Program<input value="${esc(a.c)}" disabled></label>${sel('Assign batch','b',['No batch (individual)'].concat(bs))}${FOOT('Approve & enroll')}</form>`)}
function apprSave(e,id){e.preventDefault();const a=S.apps.find(x=>x.id===id),b=e.target.b.value;
 if(a.t==='Student'&&b[0]!=='N'){S.stu.push({n:a.n,b,p:null,e:a.n.toLowerCase().replace(/\s+/g,'.')+'@mail.com',m:'+91 ',st:'Active'});adjB(b,1)}
 closeM();setApp(id,'Approved')}
/* ---- registration with fee ---- */
const RG=()=>S.reg;
function regType(t){S.reg={step:1,type:t,d:{},pay:'UPI',w:false,res:null};go()}
function regNext(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),bad=[];
 if((d.n||'').trim().length<2)bad.push('full name');if(!/^\S+@\S+\.\S+$/.test(d.e||''))bad.push('a valid email');if(!/^\+\d[\d\s-]{7,}$/.test(d.m||''))bad.push('mobile with country code (+91…)');if(RG().type==='Pastor'&&!(d.c||'').trim())bad.push('church or ministry');if(!d.t)bad.push('acceptance of terms');
 RG().d=d;if(bad.length){$('#fe').textContent='Please check: '+bad.join(', ')+'.';return}RG().step=2;go();scrollTo(0,0)}
function regWaive(){const c=($('#wc').value||'').trim().toUpperCase();if(c&&c===S.waive.toUpperCase()){RG().w=true;toast('Fee waiver applied')}else toast('That waiver code is not valid');go()}
function regMode(m){RG().pay=m;go()}
function regPay(){const g=RG(),fee=g.w?0:S.regFee,id='A-'+(101+S.apps.length),tx='TX-'+(9000+S.pay.length);
 S.apps.unshift({id,n:g.d.n,t:g.type,c:g.d.p,s:'Submitted',fee:g.w?'Waived':'Paid'});
 if(fee>0)S.pay.unshift({ref:tx,who:g.d.n,item:'Registration fee',amt:fee,date:dstr(),mode:g.pay,st:'Paid',mine:1});
 note('Application '+id+' submitted'+(fee>0?'. Registration fee '+fmt(fee)+' received.':'.'));g.res={id,tx,fee,mode:g.w?'Waiver':g.pay};g.step=3;toast('Application submitted');go();scrollTo(0,0)}
V.register=function(){const g=RG(),st=g.step,d=g.d,ped=g.type==='Pastor',
 steps=`<div class="steps">${['Your details','Registration fee','Submitted'].map((x,i)=>`<span class="${i+1<st?'d':i+1===st?'c':''}"><b>${i+1<st?'✓':i+1}</b>${x}</span>`).join('')}</div>`;
 if(st===1){const cs=S.courses.filter(c=>c[5]==='Active'&&(ped?c[1]!=='Student':c[1]!=='Pastor')).map(c=>c[0]);
  return `<div class="card">${steps}<div class="seg" style="margin-bottom:16px"><button class="${ped?'':'on'}" onclick="regType('Student')">Student</button><button class="${ped?'on':''}" onclick="regType('Pastor')">Pastor</button></div><form onsubmit="regNext(event)" novalidate>${fld('Full name','n',d.n,'autocomplete="name"')}${fld('Email','e',d.e,'type="email"')}${fld('Mobile (with country code)','m',d.m||'+91 ','type="tel"')}${fld('Date of birth','dob',d.dob,'type="date"')}${fld(ped?'Church or ministry':'Church / organization (optional)','c',d.c)}${fld('City / location','a',d.a)}${sel('Program','p',cs,d.p)}${ped?fld('Ministry role','mr',d.mr)+fld('Years of ministry','y',d.y,'type="number" min="0"'):sel('Previous Bible study','x',['None','Less than 1 year','1–3 years','More than 3 years'],d.x)+fld('Emergency contact','ec',d.ec)}${sel('Class format','f',['Batch','Individual'],d.f)}${sel('Preferred language','l',['English','Telugu','Hindi'],d.l)}${fld('Available learning times','at',d.at,'placeholder="e.g. weekday evenings"')}<label class="full"><span class="sw"><input type="checkbox" name="t" ${d.t?'checked':''}> I accept the terms, privacy policy and consent</span></label><span class="err full" id="fe"></span><div class="full"><button class="btn g">Continue to registration fee</button></div></form></div>`}
 if(st===2){const fee=g.w?0:S.regFee;
  return `<div class="card">${steps}<h3>Registration fee</h3><div class="fee"><div><span>Applicant</span><b>${esc(d.n)}</b></div><div><span>${g.type} program</span><b>${esc(d.p)}</b></div><div><span>Registration fee</span><b>${fmt(S.regFee)}</b></div>${g.w?'<div><span>Fee waiver</span><b>− '+fmt(S.regFee)+'</b></div>':''}<div class="tot"><span>Total due now</span><span>${fmt(fee)}</span></div></div>
  <div class="row" style="margin:14px 0"><input id="wc" placeholder="Fee waiver code (if you have one)" style="flex:1;min-width:200px"><button class="btn o" onclick="regWaive()">Apply</button></div>
  ${fee?`<p class="note" style="margin-bottom:8px">Payment method</p><div class="seg">${['UPI','Card','Net banking'].map(m=>`<button class="${g.pay===m?'on':''}" onclick="regMode('${m}')">${m}</button>`).join('')}</div>`:''}
  <div class="row" style="margin-top:16px"><button class="btn g" onclick="regPay()">${fee?'Pay '+fmt(fee)+' & submit':'Submit application'}</button><button class="btn o" onclick="RG().step=1;go()">Back</button></div>
  <p class="note">Course fees are billed only after approval. Paying this fee does not approve your application. Demo payment: a live gateway confirms payments on the server and card details are never stored here.</p></div>`}
 const r=g.res;return `<div class="card" style="text-align:center">${steps}<div class="ok">✓</div><h3>Application submitted</h3><p class="note" style="margin-bottom:14px">We emailed your confirmation. Next: document review and interview.</p><div class="fee" style="text-align:left;max-width:420px;margin:0 auto"><div><span>Application ID</span><b>${r.id}</b></div><div><span>Registration fee</span><b>${r.fee?fmt(r.fee):'Waived'}</b></div>${r.fee?`<div><span>Receipt</span><b>${r.tx}</b></div>`:''}<div><span>Paid via</span><b>${r.mode}</b></div></div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn g" onclick="nav('status')">Track application</button><button class="btn o" onclick="window.print()">Print receipt</button><button class="btn o" onclick="regType('Student')">New registration</button></div></div>`};
/* ---- admin views ---- */
const _crs=V.courses,_plans=V.plans,_set=V.settings,_dash=V.dashboard,_att2=V.attendance;
Object.assign(V,{
techteam:()=>staffTbl('tech'),pastors:()=>staffTbl('pastor'),
students(){const adm=S.role==='admin',L=S.stu.map((s,i)=>[s,i]).filter(x=>adm||pv(x[0].b));
 return `<div class="card"><div class="ch"><h3 style="margin:0">${adm?'Students':'My students'}</h3>${adm?'<div class="row">'+sb('Export CSV',`csv('students',['Student','Batch','Attendance %','Status'],S.stu.map(s=>[s.n,s.b,s.p===null?'':s.p,s.st]))`,'o')+sb('+ Add student','stuModal(-1)','g')+'</div>':''}</div>${table(['Student','Batch','Attendance','Status'].concat(adm?['Manage']:[]),L.map(x=>{const s=x[0],i=x[1],r=['<b>'+esc(s.n)+'</b><br><small>'+esc(s.e)+'</small>',s.b,s.p===null?'<small>No classes yet</small>':bar(s.p)+'<small>'+s.p+'%</small>',badge(s.st)];if(adm)r.push(acts([sb('Edit',`stuModal(${i})`,'o'),sb(s.st==='Active'?'Suspend':'Activate',`stuTog(${i})`,'o'),sb('Remove',`stuDel(${i})`,'o')]));return r}))}${adm?'':'<p class="note">You only see students in your assigned batches.</p>'}</div>`},
users(){const f=S.uf,all=S.staff.map(p=>({n:p.n,e:p.e,r:p.k,st:p.st,a:`staffModal('${p.id}','${p.k==='Technical Team'?'tech':'pastor'}')`,t:`stTog('${p.id}')`})).concat(S.stu.map((s,i)=>({n:s.n,e:s.e,r:'Student',st:s.st,a:`stuModal(${i})`,t:`stuTog(${i})`}))),L=f==='All'?all:all.filter(u=>f==='Students'?u.r==='Student':f==='Staff'?u.r!=='Student':u.r===f);
 return `<div class="card"><div class="ch"><h3 style="margin:0">User management</h3><div class="row">${sb('+ Student','stuModal(-1)','g')}${sb('+ Pastor / Instructor',"staffModal('','pastor')",'g')}${sb('+ Tech member',"staffModal('','tech')",'g')}</div></div><div style="margin-bottom:10px"><select aria-label="Filter users" onchange="S.uf=this.value;go()">${['All','Students','Staff','Technical Team'].map(x=>`<option${x===f?' selected':''}>${x}</option>`).join('')}</select></div>${table(['Name','Email','Role','Status','Manage'],L.map(u=>['<b>'+esc(u.n)+'</b>',esc(u.e),u.r,badge(u.st),acts([sb('Edit',u.a,'o'),sb(u.st==='Active'?'Suspend':'Activate',u.t,'o')])]))}</div>`},
batches(){if(S.role!=='admin')return _bat();return `<div class="ch"><h3 style="margin:0">Batches</h3>${sb('+ New batch','batchModal(-1)','g')}</div><div class="grid two">${S.batches.map((b,i)=>`<div class="card"><div class="ch" style="margin-bottom:6px"><h3 style="margin:0">${esc(b[1])}</h3>${badge(b[6])}</div><p style="color:var(--mut)">${b[0]} · ${esc(b[2])}<br>${esc(b[3])}</p><div class="prog" style="margin:12px 0 6px"><i style="width:${Math.min(100,b[4]/b[5]*100)}%"></i></div><small style="color:var(--mut)">${b[4]} of ${b[5]} seats filled · ${Math.max(0,b[5]-b[4])} available</small><div class="row" style="margin-top:12px">${sb('Edit',`batchModal(${i})`,'o')}${sb('Assign student',`xferModal('${b[0]}')`,'o')}${sb(b[6]==='Closed'?'Reopen':'Close',`bTog(${i})`,'o')}</div></div>`).join('')}</div>`},
courses(){if(S.role!=='admin')return _crs();return `<div class="card"><div class="ch"><h3 style="margin:0">Courses & programs</h3>${sb('+ New course',"gm('course','courses',-1,CF)",'g')}</div>${table(['Course','Audience','Duration','Lessons','Fee','Status','Manage'],S.courses.map((c,i)=>['<b>'+esc(c[0])+'</b>',c[1],esc(c[2]),c[3],esc(c[4]),badge(c[5]),sb('Edit',`gm('course','courses',${i},CF)`,'o')]))}<p class="note">Courses are archived, never deleted, so enrollments and certificates stay valid.</p></div>`},
plans(){return `<div class="card"><div class="ch"><h3 style="margin:0">Subscription plans</h3>${S.role==='admin'?sb('+ New plan',"gm('plan','plans',-1,PF)",'g'):''}</div>${table(['Plan','Audience','Duration','Price','Renewal','Status','Manage'],S.plans.map((p,i)=>[esc(p[0]),p[1],p[2],esc(p[3]),p[4],badge(p[5]),sb('Edit',`gm('plan','plans',${i},PF)`,'o')]))}<p class="note">Subscription statuses: Pending Payment, Active, Expiring Soon, Expired, Cancelled, Suspended, Refunded.</p></div>`},
settings(){return _set()+(S.role==='admin'?`<div class="card" style="margin-top:16px"><h3>Registration fee</h3><form onsubmit="event.preventDefault();S.regFee=+this.f.value;S.waive=this.w.value||S.waive;aud('Updated registration fee to '+fmt(S.regFee));toast('Registration fee saved');go()"><label>Registration fee (₹)<input name="f" type="number" min="0" value="${S.regFee}"></label><label>Fee waiver code<input name="w" value="${esc(S.waive)}"></label><div class="full"><button class="btn g">Save fee settings</button></div></form></div>`:'')},
dashboard(){return S.role==='admin'?`<div class="card"><h3>Quick actions</h3><div class="row">${sb('+ Student','stuModal(-1)','g')}${sb('+ Pastor / Instructor',"staffModal('','pastor')",'g')}${sb('+ Technical member',"staffModal('','tech')",'g')}${sb('+ Session','sessModal()')}${sb('+ Batch','batchModal(-1)')}${sb('+ Course',"gm('course','courses',-1,CF)")}</div></div><div style="height:16px"></div>`+_dash():_dash()},
attendance(){if(S.role!=='admin')return _att2();const L=S.stu.map(s=>[s.n,s.b,s.p]);return `<div class="card"><div class="ch"><h3 style="margin:0">Student attendance report</h3><button class="btn o s" onclick="csv('attendance',['Student','Batch','Attendance %'],S.stu.map(s=>[s.n,s.b,s.p===null?'':s.p]))">Export CSV</button></div>${table(['Student','Batch','Attendance','Flag'],L.map(s=>['<b>'+esc(s[0])+'</b>',s[1],s[2]===null?'<small>No classes yet</small>':bar(s[2])+'<small>'+s[2]+'%</small>',s[2]===null?badge('New'):s[2]<S.thr?badge('Low'):badge('Good')]))}<p class="note">Threshold is ${S.thr}% (change it in Settings). Cancelled classes and approved leave are excluded from the denominator.</p></div>`}});

go();
</script>
</body>
</html>
